services:
  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - ./api/node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ambassador
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ambassador
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
